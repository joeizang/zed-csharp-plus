name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Snapshot harness and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tree-sitter CLI
        # Exact pin: goldens are CLI version-sensitive (see harness/run.py).
        run: npm install -g tree-sitter-cli@0.27.0
      - name: Snapshot harness (queries, grammars, razor corpus tests)
        run: scripts/snapshot.sh --check
      - name: Rust tests
        run: cargo test --locked

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: cargo build --release --locked
